<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Cards</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f4f4;
        padding:40px;
    }

    h1{
        text-align:center;
        margin-bottom:40px;
        color:#333;
    }

    .container{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:30px;
    }

    .card{
        background:#fff;
        border-radius:15px;
        overflow:hidden;
        box-shadow:0 5px 15px rgba(0,0,0,0.1);
        transition:0.3s;
    }

    .card:hover{
        transform:translateY(-10px);
    }

    .card img{
        width:100%;
        height:180px;
        object-fit:cover;
    }

    .card-content{
        padding:20px;
        text-align:center;
    }

    .card-content h2{
        margin-bottom:10px;
        color:#333;
    }

    .card-content p{
        color:#666;
        margin-bottom:20px;
    }

    .btn{
        display:inline-block;
        padding:10px 20px;
        background:#007bff;
        color:white;
        text-decoration:none;
        border-radius:8px;
        transition:0.3s;
    }

    .btn:hover{
        background:#0056b3;
    }
</style>
</head>

<body>

<h1>My Projects World!</h1>

<div class="container">

    <!-- Card 1 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b" alt="To Do List">
        <div class="card-content">
            <h2>To Do List</h2>
            <p>Manage your daily tasks efficiently.</p>
            <a href="list.html" class="btn">Live Demo</a>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1576678927484-cc907957088c" alt="BMI Calculator">
        <div class="card-content">
            <h2>BMI Calculator</h2>
            <p>Calculate your Body Mass Index instantly.</p>
            <a href="#" class="btn">Live Demo</a>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1504608524841-42fe6f032b4b" alt="Weather App">
        <div class="card-content">
            <h2>Weather App</h2>
            <p>Check live weather updates of any city.</p>
            <a href="" class="btn">Live Demo</a>
        </div>
    </div>

    <!-- Card 4 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1509228468518-180dd4864904" alt="Calculator">
        <div class="card-content">
            <h2>Calculator</h2>
            <p>Perform quick and easy calculations.</p>
            <a href="#" class="btn">Live Demo</a>
        </div>
    </div>

</div>

</body>
</html>
