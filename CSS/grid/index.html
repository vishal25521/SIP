<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-areas: "nav nav nav"
                     "side-contend main-contend main-contend " 
                     "footer footer footer";
        }
        .item{
            border: 2px solid;
            height: 100px;
            /* width: 100px; */
        }
        .item1{
            background-color: aqua;
            grid-area: nav;
        }
        .item2{
            background-color: blueviolet;
            grid-area: nav;
        }
        .item3{
            background-color: firebrick;
            grid-area: side-contend;
        }
        .item4{
            background-color: chartreuse;
            grid-area: main-contend;
        }
        .item5{
            background-color: rgb(13, 155, 133);
            grid-area: footer;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">Box1</div>
        <div class="item item2">box2</div>
        <div class="item item3">box3</div>
        <div class="item item4">box4</div>
        <div class="item item5">Box5</div>
    </div>
</body>
</html>
