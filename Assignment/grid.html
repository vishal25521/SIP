<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con {

            display: grid;
            /* grid-template-columns: 1fr 1fr 1fr; */
            grid-template-areas: " side-contend nav2 nav"
                "side-contend main-contend main "
                "side-contend main-contend main "
                "footer footer footer";
            height: 100px;
            width: 100%;
            gap: 10px;
        }

        .text1 {
            background-color: aqua;
            grid-area: nav;



        }

        .text2 {
            background-color: blueviolet;
            grid-area: nav2;


        }

        .text3 {
            background-color: firebrick;
            grid-area: side-contend;


        }

        .text4 {
            background-color: red;
            grid-area: main;

        }

        .text5 {
            background-color: rgb(13, 155, 133);
            grid-area: main-contend;
        }

        .text6 {
            background-color: chartreuse;
            grid-area: footer;
        }
        .text{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media(max-width: 768px){
            .con{
                grid-template-areas: "nav"
                "nav2"
                "side-contend"
                "main"
                "main-contend"
                "footer";

            }  
        }
    </style>
</head>

<body>
    <div class="con">
        <div class="text text1">1</div>
        <div class="text text2">2</div>
        <div class="text text3">3</div>
        <div class="text text4">4</div>
        <div class="text text5">5</div>
        <div class="text text6">6</div>
    </div>
</body>

</html>
